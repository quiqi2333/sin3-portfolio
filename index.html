            {type:'text',text:'“屋檐下”从日常生活中的一个场景出发：人们可以在这里避雨、等人、聊天，也可以坐下来，看一会儿街上发生的事情。这些短暂而自然的停留，是人与人建立联系的开始。'},
            {type:'text',text:'屋檐因此成为整个方案的起点。它覆盖建筑，也向街道与广场延伸，在室内外之间留出可以自由进入的空间，让一顿饭、一次展览或一场偶然的交谈，都有机会发生。'},
            {type:'text',text:'场地位于校园南门附近，连接校园生活与周边街区。不同人群在这里经过、消费、工作，却未必有机会共享一段时间。设计希望通过建筑与公共空间的重新组织，让商业街拥有更多容纳日常交往的位置。'},
            {type:'image',src:'new/eaves-context-01.png',alt:'四川美术学院虎溪校区周边与南门商业街的场地位置分析图',fit:'contain',caption:'场地位置｜从校区及周边街区看南门商业街的空间关系。'},
            {type:'image',src:'new/eaves-context-02.png',alt:'四川美术学院南门商业街周边交通与步行范围分析图',fit:'contain',caption:'交通联系｜公共交通、步行范围与校园入口的关系。'}
          ]},
          {title:'让屋顶延伸出可以停留的空间',label:'02 / ROOF',blocks:[
            {type:'text',text:'折板屋顶以不同的高度和倾斜方向贯穿街区，在连续的建筑形态中形成变化。檐下的空间随之收放：有的面向广场展开，有的沿街形成遮蔽，有的在建筑之间留下穿行的入口。'},
            {type:'text',text:'从远处看，起伏的屋面形成街区的整体轮廓；走到近处，檐口的高低、建筑间的开口与台阶，进一步引导身体与空间的接触。'},
            {type:'image',src:'eaves-02.webp',alt:'折板屋顶与街区建筑体量的现场视角',caption:'折板屋顶｜屋顶形态与建筑体量共同形成连续的檐下空间。'},
            {type:'text',text:'这些半室外空间承担遮阳避雨的功能，也为坐靠、等候和小型聚会提供场所。屋顶下方保留开放的视线，让路过的人能够看到室内的展览、工作与日常活动，决定是否走近、进入或停留。'},
            {type:'image',src:'new/roof-section.webp',fit:'contain',alt:'屋顶高差与建筑沿场地展开的剖面图',caption:'屋顶高差｜剖面呈现建筑沿场地的展开与檐下空间。'}
          ]},
          {title:'让不同的日常彼此相邻',label:'03 / PROGRAM',blocks:[
            {type:'text',text:'街区由餐饮休憩、艺术工作与展览、社群活动三个部分组成。不同功能沿街展开，通过公共空间相互连接。'},
            {type:'image',src:'new/roof-functional-overview.webp',fit:'contain',alt:'屋檐下沿街公共活动的功能分区图',caption:'功能分区｜沿街组织不同的公共活动。'},
            {type:'subheading',text:'餐饮与休憩'},
            {type:'text',text:'社区食堂、餐吧与茶咖结合户外用餐区、共享长桌和小桌座位，为独处、结伴与临时停留提供不同选择。吃饭与休息成为进入街区最日常的方式，也为交谈创造机会。'},
            {type:'image',src:'new/eaves-dining.jpg',alt:'屋檐下餐饮休憩空间与沿街步行场景效果图',caption:'餐饮与休憩｜餐饮空间面向街道和广场展开。'},
            {type:'subheading',text:'艺术工作与展览'},
            {type:'text',text:'工作室、小型绘画空间和艺术展览区，将创作过程带入街道。人在经过时可以看到正在发生的工作，也可以走进展览、参加小组活动，让校园中的艺术实践与街区生活产生联系。'},
            {type:'subheading',text:'社群活动'},
            {type:'text',text:'阶梯座席、户外讨论区、共享观影区与共享客厅，为不同规模的聚集留出空间。这里既可以承接有组织的活动，也允许几个人坐下聊天，让场地在平日与活动期间都能被使用。'},
            {type:'image',src:'new/eaves-community.jpg',alt:'屋檐下阶梯座席与社群交流空间效果图',caption:'社群活动｜阶梯、平台与庭院容纳不同规模的相聚。'},
            {type:'text',text:'建筑体量按大、中、小组合：较大的空间容纳复合商业与公共活动，中型空间安排创意工坊与轻餐饮，小体量则穿插书吧、艺廊等业态。功能的差异，也带来步行过程中尺度与节奏的变化。'},
            {type:'image',src:'new/roof-behaviour.webp',fit:'contain',alt:'屋檐下用餐、工作与交流的人群行为分析图',caption:'日常活动｜用餐、工作与交流的空间安排。'}
          ]},
          {title:'让街巷连接，也让人停下来',label:'04 / STREET',blocks:[
            {type:'text',text:'铺地组织行走方向，座椅与花池界定停留的位置。水池、树木和种植带穿插其间，使入口、转角和建筑边缘成为可被使用的地方。街区的公共生活由这些分散的小空间共同承载。'},
            {type:'image',src:'eaves-04.webp',alt:'屋檐下街巷、花池与座椅的场景',caption:'停留空间｜台阶、花池与座椅为行走中的停留提供位置。'},
            {type:'text',text:'建筑之间的街巷、楼梯和平台，将沿街空间与内部庭院连接起来。人在行走中可以选择继续穿过，也可以转入较安静的角落，或沿台阶到达上层公共空间。'},
            {type:'text',text:'室内与外部广场保持视线联系。展览、用餐和交流能够被街上的人感知，建筑内部的活动也因此向外延伸。'},
            {type:'image',src:'eaves-05.webp',alt:'屋檐下建筑、街巷与庭院的步行联系',caption:'步行联系｜建筑、街巷和庭院共同组织街区内部的步行联系。'}
          ]},
          {title:'把植物与雨水带入日常',label:'05 / LANDSCAPE',blocks:[
            {type:'text',text:'植物从地面延伸到平台和建筑边缘，柔化建筑的界面，也在活动空间之间形成自然的过渡。'},
            {type:'image',src:'eaves-03.webp',alt:'屋檐下庭院植物、台阶与水面共同形成的停留空间效果图',caption:'庭院种植｜植物与台阶、水面共同形成停留空间。'},
            {type:'text',text:'木质表面、浅色墙体与深灰色屋面共同构成相对克制的材料基调，让树木、水面和人的活动成为近距离体验的一部分。'},
            {type:'image',src:'new/roof-materials.webp',fit:'contain',alt:'屋檐下建筑表面的材料与色彩分析图',caption:'材料分析｜建筑表面的材质与色彩。'},
            {type:'text',text:'折角坡屋顶同时参与雨水的组织。方案设想将屋面径流通过檐沟收集、导流，一部分进入场地内的小型景观水池，另一部分引向沿街与巷道两侧的种植花坛。屋顶、绿化与水景因此形成关联：人在檐下避雨，也能感受到雨水、植物和街区空间之间的联系。'},
            {type:'image',src:'new/roof-rainwater.webp',fit:'contain',alt:'屋面雨水收集并导向水池与种植带的分析图',caption:'雨水分析｜屋面与场地之间的导流设想。'}
          ]},
          {title:'完整方案',label:'06 / FINAL BOARDS',blocks:[
            {type:'text',text:'总体规划、平面与剖面共同呈现屋顶、建筑、街巷和景观之间的关系。两张展板分别展开设计理念与环境策略，以及功能组织、人群活动和空间构成。'},
            {type:'subheading',text:'展板 01｜共同生活的空间构想'},
            {type:'text',text:'总体鸟瞰、设计说明、场地背景、植物与材料、雨水组织及日照分析。'},
            {type:'image',src:'new/roof-board-01-thumb.webp',zoomSrc:'new/roof-board-01.jpg',fit:'contain',alt:'屋檐下完整方案展板01：共同生活的空间构想',caption:'完整方案展板 01｜共同生活的空间构想。'},
            {type:'subheading',text:'展板 02｜从功能到日常使用'},
            {type:'text',text:'功能分区、人群行为、活动空间、平剖面、整体爆炸图与关键场景。'},
            {type:'image',src:'new/roof-board-02-thumb.webp',zoomSrc:'new/roof-board-02.jpg',fit:'contain',alt:'屋檐下完整方案展板02：从功能到日常使用',caption:'完整方案展板 02｜从功能到日常使用。'},
            {type:'text',text:'四川美术学院 · 专业设计 2——场地与功能 · 小组课程设计 · 重庆 · 四川美术学院南门商业街'}
          ]}
        ]
      },
      salt: {

          {title:'食农教室：让窗外成为教材',label:'02 / FOOD & FARM CLASSROOM',blocks:[

              {src:'new/salt-fig-51.jpg',fit:'contain',alt:'架空教学空间与田间环境的鸟瞰效果',caption:'田间视角｜架空空间与周边稻田的关系。'}

              {src:'new/salt-fig-11.png',fit:'contain',alt:'田间架空步道与红色遮阳构件场景',caption:'架空步道｜步道平台连接田间空间。'}

            {type:'image',src:'new/salt-fig-26.png',fit:'contain',alt:'食农教室节点的平面与立面图纸',caption:'图纸｜食农教室的平面与立面。'},

            {type:'image',src:'new/salt-fig-58.png',fit:'contain',alt:'食农教室构筑形成过程分析图',caption:'构筑过程｜从路径、支点到平台的形成。'},

            {type:'image',src:'new/salt-fig-34.png',fit:'contain',alt:'食材处理、烹饪体验与共享长桌的功能流程图',caption:'功能流程｜食材处理、烹饪体验与共享长桌。'},

            {type:'image',src:'new/salt-fig-56.jpg',fit:'contain',alt:'合家欢厨房旁的滑梯与田间亲子活动场景',caption:'滑梯与活动｜为儿童和亲子互动留出活动空间。'}

            {type:'text',text:'斜向支撑、平台、栏杆与编织遮阳构件组成开放的空间。遮阳面在高处起伏，保留与天空、风和周围景色的联系；平台则提供停留、交谈与远望的位置。'},

            {type:'subheading',text:'地｜顺应场地与乡村经验'}, {type:'text',text:'从稻田、水系与生产器物中寻找设计线索，让空间的形态和用途与所在环境有关。'},

          {title:'让空间持续被使用',label:'06 / OPERATION PROPOSAL',blocks:[

    function renderAbout(){
      const intro='以空间与环境设计为主要创作方向，也在探索游戏策划与数字创作。从课程中的空间方案，到项目中的尝试与落地，再到合作社里的劳动与售卖，我在不同的实践中积累经验，尝试把想法变成具体的作品。';
      const initial=`<section class="about-page"><div class="about-journey" id="about-journey"><section class="about-intro-stage"><div class="about-intro"><p class="about-lead">${intro}</p><a class="about-resume-link" href="#resume" data-about-resume>查看简历 <span aria-hidden="true">↗</span></a></div><div class="about-scroll-hint">SCROLL TO BROWSE</div></section><section class="about-content-stage"><div class="about-identity" aria-label="桑艺珊的专业方向"><div class="eyebrow">ABOUT / SIN3</div><h1>桑艺珊</h1><div class="about-categories"><span>环境设计</span><span>游戏策划</span><span>Vibe Coding</span></div></div><section class="about-grid" aria-label="个人照片与经历"><div class="about-grid-items" data-scatter-settled="false">${[3,0,2,1,4,5].map(i=>aboutCard(aboutStories[i],i)).join('')}</div></section></section></div><footer class="about-footer"><span>SIN3　/　SANG YISHAN</span><span>ABOUT</span></footer></section>`;
      app.innerHTML=initial;app.querySelectorAll('[data-about-resume]').forEach(link=>link.onclick=e=>{e.preventDefault();go('#resume')});app.querySelector('[data-about-card="3"]').onclick=e=>{e.preventDefault();go('#resume',false,{resumeFocusCard:3})};measureAboutCards();updateAboutFlow();nav();
    }
    const aboutStarts=[
      {x:-2,y:13,w:17,h:24,r:-11},{x:85,y:12,w:17,h:24,r:10},
      {x:-2,y:70,w:17,h:24,r:-8},{x:85,y:69,w:17,h:24,r:8},
      {x:23,y:-5,w:17,h:24,r:-5},{x:62,y:83,w:17,h:24,r:7}
    ];
    const aboutMobileStarts=[
      {x:-4,y:9,w:27,h:20,r:-9},{x:77,y:8,w:27,h:20,r:8},
      {x:-4,y:72,w:27,h:20,r:-7},{x:77,y:71,w:27,h:20,r:7},
      {x:22,y:-5,w:27,h:20,r:-4},{x:57,y:83,w:27,h:20,r:6}
    ];
    const aboutClamp=v=>Math.max(0,Math.min(1,v));
    const aboutSmooth=v=>{v=aboutClamp(v);return v*v*(3-2*v)};
    function updateAboutFlow(){
      const section=document.querySelector('#about-journey');if(!section)return;
      const intro=section.querySelector('.about-intro'),identity=section.querySelector('.about-identity'),gridItems=section.querySelector('.about-grid-items'),cards=[...section.querySelectorAll('.about-story-card')];
      if(cards.length!==aboutCardBases.length||aboutMeasuredWidth!==window.innerWidth||aboutMeasuredHeight!==window.innerHeight)measureAboutCards();
      const sectionTop=section.getBoundingClientRect().top+window.scrollY,progress=aboutClamp((window.scrollY-sectionTop)/Math.max(1,window.innerHeight)),settle=aboutSmooth(progress);
      const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduced){intro.style.opacity='1';intro.style.transform='none';identity.style.opacity='1';identity.style.transform='none';gridItems.dataset.scatterSettled='true';cards.forEach(card=>{card.style.transform='none';const photo=card.querySelector('.about-photo'),info=card.querySelector('.about-card-info');if(photo)photo.style.cssText='';if(info)info.style.opacity='1';if(card.matches('a.about-profile-card'))card.tabIndex=0});return}
      const introFade=aboutSmooth(progress/.78);intro.style.opacity=String(1-introFade);intro.style.transform=`translateY(${-22*introFade}px)`;intro.style.pointerEvents=introFade>.95?'none':'auto';const resumeLink=intro.querySelector('[data-about-resume]');if(resumeLink){resumeLink.tabIndex=introFade>.95?-1:0;resumeLink.setAttribute('aria-hidden',String(introFade>.95))}
      const identityIn=aboutSmooth((progress-.12)/.83);identity.style.opacity=String(identityIn);identity.style.transform=`translateY(${(1-identityIn)*16}px)`;
      const isMobile=window.innerWidth<=760,starts=isMobile?aboutMobileStarts:aboutStarts,scrollTop=window.scrollY;
      gridItems.dataset.scatterSettled=String(progress>=.96);
      cards.forEach((card,i)=>{
        const base=aboutCardBases[i],start=starts[i]||starts[starts.length-1];if(!base)return;
        const baseCenterX=base.left+base.width/2,baseCenterY=base.top-scrollTop+base.height/2;
        const startWidth=start.w/100*window.innerWidth,startHeight=start.h/100*window.innerHeight,startCenterX=start.x/100*window.innerWidth+startWidth/2,startCenterY=start.y/100*window.innerHeight+startHeight/2;
        const centerX=startCenterX+(baseCenterX-startCenterX)*settle,centerY=startCenterY+(baseCenterY-startCenterY)*settle;
        const startScale=Math.min(startWidth/base.width,startHeight/base.height),scale=startScale+(1-startScale)*settle;
        const dx=centerX-baseCenterX,dy=centerY-baseCenterY,rotation=start.r*(1-settle);
        card.style.transform=`translate3d(${dx}px,${dy}px,0) rotate(${rotation}deg) scale(${scale})`;
        const photo=card.querySelector('.about-photo');if(photo){photo.style.left=(14*settle)+'%';photo.style.top=(6*settle)+'%';photo.style.width=(100-28*settle)+'%';photo.style.height=(100-23*settle)+'%';photo.style.borderRadius=(13-3*settle)+'px'}
        const info=card.querySelector('.about-card-info');if(info)info.style.opacity=String(aboutSmooth((progress-.68)/.25));
        if(card.matches('a.about-profile-card'))card.tabIndex=progress>=.96?0:-1;
      });
      const hint=section.querySelector('.about-scroll-hint');if(hint)hint.style.opacity=String(1-aboutSmooth(progress/.72));
    }

    function renderResume(){
      const stats=resumeData.stats.map(item=>`<div class="resume-stat"><strong>${esc(item.value)}</strong><span>${esc(item.label)}</span></div>`).join('');
      const experiences=resumeData.experiences.map(item=>`<section class="resume-section"><h2 class="resume-section-title">${esc(item.section)}</h2><article class="resume-entry"><h3>${esc(item.title)}</h3><div class="resume-entry-meta">${esc(item.meta)}${item.scale?`　·　${esc(item.scale)}`:''}</div><p>${esc(item.description)}</p></article></section>`).join('');
      const skills=resumeData.skills.map(item=>`<div class="resume-skill"><h3>${esc(item.label)}</h3><p>${esc(item.text)}</p></div>`).join('');
      app.innerHTML=`<section class="resume-page"><div class="resume-shell"><a class="resume-return-top" href="#about" data-resume-about>← 返回 About</a><header class="resume-hero"><div class="resume-brand">${esc(resumeData.brand)}　/　PROFILE</div><h1 class="resume-name">${esc(resumeData.name)}</h1><p class="resume-headline">${esc(resumeData.headline)}</p><div class="resume-contact"><a href="mailto:${esc(resumeData.contact)}">${esc(resumeData.contact)}</a><span>意向城市：${resumeData.locations.map(esc).join('、')}</span><span>${esc(resumeData.availability)}</span></div></header><section class="resume-stats" aria-label="个人数据">${stats}</section>${experiences}<section class="resume-section"><h2 class="resume-section-title">教育背景</h2><div class="resume-education"><strong>${esc(resumeData.education.school)}｜${esc(resumeData.education.major)}｜${esc(resumeData.education.status)}</strong><p>${esc(resumeData.education.year)}，${esc(resumeData.education.graduation)}；专业课平均分90+。</p></div></section><section class="resume-section"><h2 class="resume-section-title">技能</h2><div class="resume-skills">${skills}</div></section><section class="resume-section resume-strengths"><h2 class="resume-section-title">个人优势</h2><p>${esc(resumeData.strengths)}</p></section><footer class="resume-footer"><p>联系邮箱<br><a href="mailto:${esc(resumeData.contact)}">${esc(resumeData.contact)}</a></p><a class="resume-return-bottom" href="#about" data-resume-about>返回 About　↗</a></footer></div></section>`;
      app.querySelectorAll('[data-resume-about]').forEach(link=>link.onclick=e=>{e.preventDefault();returnResumeToAbout()});nav();
    }
    function render(){clearInterval(cycleTimer);cycleTimer=null;if(activeGamePlanReader)closeGamePlanReader({restoreFocus:false,restoreScroll:false});const r=currentRoute();document.body.classList.toggle('resume-mode',r.type==='resume');document.body.classList.toggle('about-mode',r.type==='about');if(r.type==='category')renderCategory(r.id);else if(r.type==='coursework')renderCoursework();else if(r.type==='project')renderProject(r.id);else if(r.type==='about')renderAbout();else if(r.type==='resume')renderResume();else renderHome(r.stage);requestAnimationFrame(updateTopbarGlass)}
    function openLightbox(src,caption){const d=document.querySelector('#lightbox');d.querySelector('img').src=src;d.querySelector('img').alt=caption;d.querySelector('.lightbox-caption').textContent=caption;d.showModal()}
    history.scrollRestoration='manual';document.querySelector('#lightbox .lightbox-close').onclick=()=>document.querySelector('#lightbox').close();document.querySelector('#lightbox').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(cycleTimer);cycleTimer=null}else if(currentRoute().type==='home'&&currentRoute().stage==='work'&&restartHubCycle)restartHubCycle()});window.addEventListener('popstate',event=>{render();const route=currentRoute(),state=event.state||{},restore=Math.max(0,Number(state.scrollY)||0);requestAnimationFrame(()=>{window.scrollTo({top:restore,behavior:'auto'});updateAboutFlow();updateTopbarGlass();if(route.type==='about'&&state.resumeFocusCard===3){const card=document.querySelector('#about-journey [data-about-card="3"]');if(card&&card.tabIndex===0)card.focus({preventScroll:true})}})});window.addEventListener('scroll',()=>{if(!window.__aboutRaf){window.__aboutRaf=requestAnimationFrame(()=>{window.__aboutRaf=0;updateAboutFlow();updateTopbarGlass()})}},{passive:true});window.addEventListener('resize',()=>requestAnimationFrame(()=>{measureAboutCards();updateAboutFlow();updateTopbarGlass()}));render();
  </script>
</body>
</html>
